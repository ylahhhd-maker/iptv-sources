name: Sync IPTV sources

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download upstream playlists
        run: |
          set -eu
          curl -fsSL --retry 3 --max-time 180 -o iptv.m3u8 https://raw.githubusercontent.com/joevess/IPTV/main/iptv.m3u8
          curl -fsSL --retry 3 --max-time 180 -o myiptv-ipv4.m3u https://raw.githubusercontent.com/suxuang/myIPTV/main/ipv4.m3u
          curl -fsSL --retry 3 --max-time 180 -o myiptv-ipv6.m3u https://raw.githubusercontent.com/suxuang/myIPTV/main/ipv6.m3u
          for f in iptv.m3u8 myiptv-ipv4.m3u myiptv-ipv6.m3u; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 5000 ] || ! grep -q "EXTINF" "$f"; then
              echo "::error::$f looks invalid (size=$size)"
              exit 1
            fi
            echo "$f OK, size=$size"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No change this run"
          else
            git commit -m "chore: sync $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
